name: Generate Daily Podcast

on:
  schedule:
    # Run every day at 8 AM UTC. This will run the default show.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      show_name:
        description: 'The name of the show to generate (must match a name in shows.json)'
        required: true
        default: 'Tech Today'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt

    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Set Show Name
      id: set_show
      run: |
        SHOW_NAME="${{ github.event.inputs.show_name || 'Tech Today' }}"
        echo "SHOW_NAME=$SHOW_NAME" >> $GITHUB_ENV
        SAFE_NAME=$(echo "$SHOW_NAME" | tr ' ' '-')
        echo "SAFE_SHOW_NAME=podcast-$SAFE_NAME" >> $GITHUB_ENV

    - name: Generate podcast
      run: |
        cd src
        python generate_podcast.py --show "${{ env.SHOW_NAME }}"

    - name: Upload podcast as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SAFE_SHOW_NAME }}
        path: src/*.mp3
